name: Keepalive

# GitHub automatically disables scheduled workflows after 60 days without
# any repository activity (pushes, PRs, etc.). This workflow keeps the repo
# "active" by pushing a small commit periodically, so that the Publish
# workflow's cron schedule never gets auto-disabled.
#
# Runs well within the 60 day window (every month) and can also be
# triggered manually if needed.
#
# The commit is empty and must stay inert: it must not trigger or alter any
# other workflow, release, tag or changelog. The "chore: keepalive" prefix is
# relied upon by the ToolboxPlugins repo (git-cliff skip rule, main->dev sync
# filter), and "[skip ci]" suppresses any push/pull_request triggered workflow.
# Publish only runs on schedule/workflow_dispatch and takes release notes from
# ToolboxPlugins, so it never reads this repo's commit history.

on:
  schedule:
    - cron: "0 0 1 */1 *" # once a month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Keep repository active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive - prevent scheduled workflows from being disabled [skip ci]"
          git push
